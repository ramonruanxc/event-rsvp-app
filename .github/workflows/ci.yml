name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:unit

  integration:
    name: integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: rsvp, POSTGRES_PASSWORD: rsvp, POSTGRES_DB: rsvp_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rsvp" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:int

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    env:
      E2E_PORT: '3000'
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: rsvp, POSTGRES_PASSWORD: rsvp, POSTGRES_DB: rsvp_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rsvp" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }

  traceability:
    name: traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run trace

  container-smoke:
    name: container-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run docker:journey
      - run: npx tsx scripts/docker/smoke-cli.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:container
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: container-journey, path: test-results/container, retention-days: 7 }
      - if: failure()
        run: docker compose logs app
      - if: always()
        run: docker compose down -v

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rsvp
      POSTGRES_PASSWORD: rsvp
      POSTGRES_DB: rsvp
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rsvp']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata: {}
